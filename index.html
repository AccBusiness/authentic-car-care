<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Authentic Car Care — Mobile Detail · PEI</title>
  <meta name="description" content="Mobile car detailing across Prince Edward Island. Express, Interior, Exterior, and Complete Care — we come to your driveway." />
  <link rel="icon" href="project/assets/logo.png" type="image/png" />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Josefin+Sans:wght@100;200;300;400;500;600;700&family=Manrope:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">

  <style>
/* ========== Authentic Car Care — landing styles ========== */
:root {
  --bg: #ffffff;
  --bg-2: #f5f6f8;
  --surface: #f0f2f5;
  --surface-2: #e6e9ed;
  --line: rgba(0,0,0,0.07);
  --line-strong: rgba(0,0,0,0.13);
  --fg: #0e1117;
  --fg-dim: #4a5060;
  --fg-mute: #7a7f8c;
  --ice: #2678b0;
  --ice-bright: #3a8cc4;
  --ice-deep: #1a5f8f;
  --ice-glow: rgba(38, 120, 176, 0.20);
  --black: #000;
  --radius-s: 10px;
  --radius-m: 18px;
  --radius-l: 28px;
  --radius-xl: 40px;
  --shadow-ice: 0 0 0 1px rgba(38,120,176,0.25), 0 24px 60px -20px rgba(26,95,143,0.18);
}

* { box-sizing: border-box; -webkit-font-smoothing: antialiased; }
html, body { margin:0; padding:0; background: var(--bg); color: var(--fg); }
body {
  font-family: 'Manrope', ui-sans-serif, system-ui, sans-serif;
  font-size: 16px;
  line-height: 1.5;
  letter-spacing: -0.005em;
  overflow-x: hidden;
}

.display {
  font-family: 'Josefin Sans', 'Manrope', sans-serif;
  font-weight: 300;
  letter-spacing: 0.08em;
  line-height: 0.95;
  text-transform: uppercase;
}
.mono { font-family: 'JetBrains Mono', ui-monospace, monospace; }

a { color: inherit; text-decoration: none; }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
img { display: block; max-width: 100%; }

/* ---------- Layout ---------- */
.wrap { width: min(1240px, 92vw); margin: 0 auto; }
section { position: relative; padding: 120px 0; }
@media (max-width: 720px){ section { padding: 80px 0; } }

/* ---------- Nav ---------- */
.nav {
  position: fixed; top: 0; left: 0; right: 0; z-index: 60;
  padding: 18px 0;
  background: linear-gradient(to bottom, rgba(255,255,255,0.92), rgba(255,255,255,0));
  backdrop-filter: blur(14px) saturate(140%);
  -webkit-backdrop-filter: blur(14px) saturate(140%);
}
.nav-inner { display:flex; align-items:center; justify-content:space-between; gap:24px; }
.brand { display:flex; align-items:center; gap:12px; }
.brand-mark { width: 42px; height: 42px; border-radius: 50%; background: transparent; border: none; display:grid; place-items:center; padding: 2px; }
.brand-mark img { width: 100%; height: 100%; object-fit: contain; }
.brand-name { display:flex; flex-direction:column; line-height: 1; }
.brand-name b { font-family:'Josefin Sans',sans-serif; font-size: 17px; letter-spacing: 0.08em; font-weight: 300; text-transform: uppercase; }
.brand-name span { font-size: 11px; color: var(--ice); margin-top: 3px; letter-spacing: 0.18em; text-transform: uppercase; }

.nav-links { display:flex; gap: 28px; align-items:center; }
.nav-links a { font-size: 14px; color: var(--fg-dim); transition: color .2s; }
.nav-links a:hover { color: var(--fg); }
@media (max-width: 820px){ .nav-links { display:none; } }

.btn {
  display:inline-flex; align-items:center; gap: 10px;
  padding: 12px 20px;
  border-radius: 999px;
  font-weight: 600; font-size: 14px;
  border: 1px solid var(--line-strong);
  background: rgba(0,0,0,0.03);
  transition: all .2s ease;
}
.btn:hover { background: rgba(0,0,0,0.07); transform: translateY(-1px); }
.btn-ice {
  background: var(--ice);
  color: #061018;
  border-color: transparent;
  box-shadow: 0 10px 30px -10px var(--ice-glow);
}
.btn-ice:hover { background: var(--ice-bright); box-shadow: 0 18px 40px -10px var(--ice-glow); }
.btn-lg { padding: 16px 28px; font-size: 15px; }

/* ---------- Hero — silver studio ---------- */
.hero-v2 {
  min-height: 100vh;
  background: linear-gradient(
    to bottom,
    #c6c7c9 0%,
    #cccdd0 40%,
    #dadbdd 62%,
    #eef0f1 82%,
    var(--bg) 100%
  );
  position: relative;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  align-items: center;
}
.stage-cinema {
  position: relative;
  width: 100%;
  flex: 1 1 auto;
  min-height: 0;
  z-index: 1;
}
.bat-halo,
.bat-signal,
.bat-signal-sharp,
.bat-signal-glow,
.hero-car-svg-wrap,
.hero-car-svg { display: none; }

.hero-bg-img {
  display: block;
  width: 100%;
  height: 72vh;
  object-fit: cover;
  object-position: center 42%;
  -webkit-mask-image: linear-gradient(to bottom, #000 0%, #000 66%, transparent 97%);
  mask-image: linear-gradient(to bottom, #000 0%, #000 66%, transparent 97%);
}
.hero-vignette { display: none; }
.hero-floor { display: none; }

.hero-content {
  position: relative;
  z-index: 10;
  width: 100%;
  text-align: center;
  padding: 0 20px 90px;
  margin-top: -1vh;
  background: transparent;
}
.hero-content h1 {
  font-family: 'Josefin Sans', sans-serif;
  font-weight: 200;
  font-size: clamp(52px, 7.5vw, 110px);
  letter-spacing: 0.12em;
  line-height: 0.95;
  margin: 0 auto 22px;
  max-width: 16ch;
  text-transform: uppercase;
  color: var(--fg);
}
.hero-content h1 em { font-style: normal; color: var(--ice-deep); }
.hero-content p.lead { font-size: clamp(15px, 1.3vw, 18px); color: rgba(14,17,23,0.65); max-width: 500px; margin: 0 auto 32px; }
.hero-content .hero-cta { display:flex; gap: 14px; flex-wrap: wrap; justify-content: center; align-items: center; }

@media (max-width: 720px){
  .hero-bg-img { height: 45vh; }
  .hero-content { padding-bottom: 60px; }
}

.eyebrow {
  display:inline-flex; align-items:center; gap:10px;
  padding: 8px 14px; border-radius: 999px;
  background: rgba(38,120,176,0.08);
  border: 1px solid rgba(38,120,176,0.18);
  color: var(--ice);
  font-size: 12px; letter-spacing: 0.16em; text-transform: uppercase;
  font-weight: 600;
}
.eyebrow .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--ice); box-shadow: 0 0 10px var(--ice); animation: pulse 2s infinite; }
@keyframes pulse { 0%,100% { opacity:1; } 50% { opacity: 0.4; } }

.hero-stat .num { font-family:'Josefin Sans',sans-serif; font-size: 32px; font-weight: 700; letter-spacing: -0.03em; }
.hero-stat .lbl { font-size: 12px; color: var(--fg-mute); letter-spacing: 0.14em; text-transform: uppercase; margin-top: 4px; }

/* ---------- Section title ---------- */
.section-title {
  display:flex; justify-content: space-between; align-items: flex-end; gap: 30px;
  margin-bottom: 60px; flex-wrap: wrap;
}
.section-title h2 {
  font-family:'Josefin Sans',sans-serif;
  font-size: clamp(36px, 5vw, 64px);
  font-weight: 300; letter-spacing: 0.06em; line-height: 1.05; margin: 12px 0 0;
  text-transform: uppercase;
  max-width: 760px;
}
.section-title h2 em { font-style: normal; color: var(--ice); }
.section-kicker { font-size: 12px; letter-spacing: 0.2em; text-transform: uppercase; color: var(--ice); font-weight: 600; }
.section-title .sub { color: var(--fg-dim); font-size: 16px; max-width: 360px; }

/* ---------- Services (flip cards) ---------- */
.services-grid {
  display: grid; grid-template-columns: repeat(4, 1fr); gap: 18px;
}
@media (max-width: 1000px){ .services-grid { grid-template-columns: repeat(2, 1fr); } }
@media (max-width: 560px){ .services-grid { grid-template-columns: 1fr; } }

.svc-card-wrap {
  position: relative;
  height: 480px;
  perspective: 1400px;
  cursor: pointer;
}
.svc-card-inner {
  position: relative;
  width: 100%; height: 100%;
  transform-style: preserve-3d;
  transition: transform .7s cubic-bezier(.2,.7,.2,1);
}
.svc-card-wrap:hover .svc-card-inner { transform: rotateY(180deg); }

.svc-face {
  position: absolute; inset: 0;
  backface-visibility: hidden;
  -webkit-backface-visibility: hidden;
  background: linear-gradient(180deg, var(--surface), var(--bg-2));
  border: 1px solid var(--line);
  border-radius: var(--radius-l);
  padding: 28px;
  display: flex; flex-direction: column;
  transition: border-color .3s, box-shadow .3s;
  overflow: hidden;
}
.svc-front {
  background:
    radial-gradient(ellipse at top right, rgba(38,120,176,0.04), transparent 60%),
    linear-gradient(180deg, var(--surface), var(--bg-2));
}
.svc-back {
  transform: rotateY(180deg);
  background:
    radial-gradient(ellipse at top, rgba(38,120,176,0.06), transparent 50%),
    linear-gradient(180deg, var(--surface-2), var(--bg-2));
  border-color: rgba(38,120,176,0.2);
}

.svc-card-wrap.selected .svc-face { border-color: var(--ice); }
.svc-card-wrap:hover .svc-face { box-shadow: var(--shadow-ice); }

.svc-num { font-family:'JetBrains Mono', monospace; font-size: 11px; color: var(--fg-mute); letter-spacing: 0.2em; }
.svc-icon {
  margin: 14px 0 22px;
  width: 56px; height: 56px;
  display: grid; place-items: center;
  border-radius: 14px;
  background: rgba(38,120,176,0.08);
  border: 1px solid rgba(38,120,176,0.15);
}
.svc-face h3 {
  font-family:'Josefin Sans',sans-serif;
  font-size: clamp(22px, 1.6vw, 26px);
  letter-spacing: 0.04em; font-weight: 400;
  text-transform: uppercase;
  margin: 0 0 8px;
  line-height: 1.05;
}
.svc-face .tag { font-size: 13px; color: var(--fg-dim); margin-bottom: 18px; }

.price-block { margin-top: auto; display: flex; flex-direction: column; gap: 2px; }
.price-block .from {
  font-size: 11px; color: var(--ice); font-weight: 600;
  letter-spacing: 0.16em; text-transform: uppercase;
}
.price-block .price {
  font-family:'Josefin Sans',sans-serif;
  font-size: 44px; font-weight: 700; letter-spacing: -0.03em; color: var(--ice);
  line-height: 1;
}

.svc-hint {
  margin-top: 16px;
  font-size: 11px; color: var(--fg-mute);
  letter-spacing: 0.12em; text-transform: uppercase;
  border-top: 1px solid var(--line);
  padding-top: 14px;
}

.svc-back ul { padding: 0; margin: 14px 0 20px; list-style:none; }
.svc-back ul li {
  font-size: 14px; color: var(--fg);
  padding: 9px 0; padding-left: 24px; position: relative;
  border-bottom: 1px solid var(--line);
}
.svc-back ul li:last-child { border-bottom: 0; }
.svc-back ul li::before {
  content:'✓'; position: absolute; left: 0; top: 9px;
  color: var(--ice); font-weight: 700; font-size: 13px;
}

.check {
  position: absolute; top: 22px; right: 22px;
  width: 28px; height: 28px; border-radius: 50%;
  border: 1.5px solid var(--line-strong);
  display: grid; place-items: center; transition: all .25s;
}
.svc-card-wrap.selected .check { background: var(--ice); border-color: var(--ice); }
.svc-card-wrap.selected .check svg { stroke: #061018; opacity: 1; }
.check svg { stroke: transparent; opacity: 0; transition: opacity .25s; }

/* Touch fallback — show back-side on tap (no hover) */
@media (hover: none) {
  .svc-card-wrap.selected .svc-card-inner { transform: rotateY(180deg); }
  .svc-hint { display: none; }
}

/* ---------- Add-ons ---------- */
.addons-card {
  margin-top: 24px;
  background: linear-gradient(135deg, rgba(38,120,176,0.05), rgba(38,120,176,0.02));
  border: 1px solid var(--line);
  border-radius: var(--radius-l);
  padding: 32px;
}
.addons-header { display:flex; justify-content: space-between; align-items: flex-start; gap: 20px; flex-wrap: wrap; }
.addons-header h3 { font-family:'Josefin Sans',sans-serif; font-size: 24px; letter-spacing: -0.02em; margin: 0; }
.addons-header p { color: var(--fg-dim); font-size: 14px; margin: 4px 0 0; }
.addons-row { display:flex; gap: 14px; flex-wrap: wrap; margin-top: 24px; }
.addon-chip {
  display:flex; align-items:center; gap: 12px;
  padding: 14px 22px;
  border-radius: 999px;
  border: 1.5px solid var(--line-strong);
  background: rgba(0,0,0,0.02);
  transition: all .2s;
  font-size: 14px; font-weight: 500;
}
.addon-chip:hover:not(:disabled) { border-color: rgba(38,120,176,0.4); }
.addon-chip.on { background: var(--ice); color: #061018; border-color: var(--ice); box-shadow: 0 8px 24px -8px var(--ice-glow); }
.addon-chip:disabled { opacity: 0.4; cursor: not-allowed; }
.addon-chip .plus { font-family:'JetBrains Mono', monospace; font-weight: 700; color: var(--ice); }
.addon-chip.on .plus { color: #061018; }
.addon-chip .note { font-size: 11px; color: var(--fg-mute); }
.addon-chip.on .note { color: rgba(6,16,24,0.6); }

/* ---------- Quote bar (sticky summary) ---------- */
.quote-bar {
  margin-top: 30px;
  background: var(--bg-2);
  border: 1px solid var(--line);
  border-radius: var(--radius-l);
  padding: 22px 28px;
  display:flex; align-items: center; justify-content: space-between; gap: 24px;
  flex-wrap: wrap;
}
.quote-bar .left { display:flex; flex-direction:column; gap: 4px; }
.quote-bar .label { font-size: 11px; letter-spacing: 0.2em; color: var(--fg-mute); text-transform: uppercase; }
.quote-bar .total { font-family:'Josefin Sans',sans-serif; font-size: 40px; font-weight: 700; letter-spacing: -0.03em; }
.quote-bar .total em { color: var(--ice); font-style: normal; }
.quote-bar .breakdown { font-size: 13px; color: var(--fg-dim); }

/* ---------- Before/After menu ---------- */
.menu-tabs { display:flex; gap: 8px; flex-wrap: wrap; margin-bottom: 28px; }
.menu-tab {
  padding: 10px 18px;
  border-radius: 999px;
  border: 1px solid var(--line-strong);
  background: transparent;
  color: var(--fg-dim);
  font-size: 13px; font-weight: 500;
  transition: all .2s;
}
.menu-tab:hover { color: var(--fg); }
.menu-tab.on { background: var(--fg); color: #07080a; border-color: var(--fg); }

.ba-wrap {
  display: grid; grid-template-columns: 1fr 1fr; gap: 24px; align-items: start;
}
@media (max-width: 900px){ .ba-wrap { grid-template-columns: 1fr; } }

.ba-stage {
  position: relative;
  border-radius: var(--radius-l);
  overflow: hidden;
  aspect-ratio: 4 / 3;
  background: #000;
  border: 1px solid var(--line);
  user-select: none;
  cursor: ew-resize;
  min-height: 0;
}
.ba-img { position: absolute; inset: 0; display: grid; place-items: center; }
.ba-img-after { z-index: 2; }
.ba-clip { position: absolute; inset: 0; clip-path: inset(0 50% 0 0); transition: clip-path .12s ease-out; will-change: clip-path; }
/* Real before/after photos — keep the 4/3 box, fit whole photo inside */
.ba-stage-photo { background: #0a0a0a; }
.ba-photo { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; }
/* matched-shape pairs fill the box edge-to-edge (no letterbox) */
.ba-stage-fill .ba-photo { object-fit: cover; }
.ba-handle {
  position: absolute; top: 0; bottom: 0; width: 3px; background: var(--ice);
  box-shadow: 0 0 24px var(--ice-glow);
  z-index: 5; pointer-events: none;
  transition: left .12s ease-out;
  will-change: left;
}
.ba-knob {
  position: absolute; top: 50%; left: 50%;
  width: 56px; height: 56px; border-radius: 50%;
  background: var(--ice); color: #061018;
  display: grid; place-items: center;
  transform: translate(-50%, -50%);
  box-shadow: 0 0 0 6px rgba(38,120,176,0.15), 0 0 30px var(--ice-glow);
  font-weight: 700; font-size: 18px;
  transition: left .12s ease-out;
  will-change: left;
}
.ba-label {
  position: absolute; top: 18px;
  padding: 6px 12px; border-radius: 999px;
  font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase; font-weight: 700;
  z-index: 4; backdrop-filter: blur(8px);
}
.ba-label.before { left: 18px; background: rgba(0,0,0,0.5); color: #fff; border: 1px solid rgba(255,255,255,0.2); }
.ba-label.after { right: 18px; background: var(--ice); color: #061018; }

.ba-meta {
  background: linear-gradient(180deg, var(--surface), var(--bg-2));
  border: 1px solid var(--line);
  border-radius: var(--radius-l);
  padding: 28px;
  display: flex; flex-direction: column;
  overflow: hidden;
}
.ba-meta .tag-pill {
  display:inline-flex; padding: 5px 11px; border-radius: 999px;
  background: rgba(38,120,176,0.08); color: var(--ice);
  font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase; font-weight: 600;
  width: fit-content;
}
.ba-meta h3 { font-family:'Josefin Sans',sans-serif; font-size: clamp(20px, 1.8vw, 26px); letter-spacing: -0.025em; margin: 12px 0 8px; line-height: 1.1; }
.ba-meta p { color: var(--fg-dim); font-size: 13px; line-height: 1.55; margin: 0 0 16px; }
.ba-meta .detail-list { display:flex; flex-direction: column; gap: 0; margin: 0 0 14px; }
.ba-meta .detail-list div { display:flex; justify-content: space-between; padding: 9px 0; border-bottom: 1px solid var(--line); font-size: 12px; }
.ba-meta .detail-list div:last-child { border-bottom: 0; }
.ba-meta .detail-list span:first-child { color: var(--fg-mute); letter-spacing: 0.08em; text-transform: uppercase; font-size: 10px; }
.ba-meta .detail-list span:last-child { color: var(--fg); font-weight: 600; font-family:'JetBrains Mono',monospace; font-size: 11px; }
.ba-thumbs { display:flex; gap: 8px; margin-top: auto; padding-top: 12px; }
.ba-thumb {
  position: relative;
  flex: 1; aspect-ratio: 4/3; border-radius: 8px; overflow: hidden; cursor: pointer;
  border: 2px solid transparent; transition: all .2s; padding: 0;
  max-height: 64px;
}
.ba-thumb.on { border-color: var(--ice); }
.ba-thumb .ba-photo { object-fit: cover; object-position: center 35%; }

/* Placeholder vehicle 'photos' */
.fake-photo {
  width: 100%; height: 100%;
  display: grid; place-items: center;
  position: relative; overflow: hidden;
}
.fake-photo .grain {
  position: absolute; inset: 0;
  background-image:
    radial-gradient(circle at 20% 30%, rgba(255,255,255,0.06), transparent 30%),
    radial-gradient(circle at 80% 60%, rgba(255,255,255,0.04), transparent 30%);
}
.fp-before {
  background:
    radial-gradient(ellipse at 50% 70%, #2a2520 0%, #15110d 60%, #0a0807 100%);
}
.fp-after {
  background:
    radial-gradient(ellipse at 50% 30%, #2b3a47 0%, #142028 50%, #060c10 100%);
}
.fake-car {
  width: 78%; aspect-ratio: 2.4/1;
  position: relative;
  filter: drop-shadow(0 30px 40px rgba(0,0,0,0.7));
}
.fp-before .dirt {
  position:absolute; inset: 0;
  background:
    radial-gradient(ellipse at 20% 60%, rgba(120,90,60,0.5), transparent 25%),
    radial-gradient(ellipse at 70% 70%, rgba(140,110,80,0.4), transparent 30%),
    radial-gradient(ellipse at 50% 50%, rgba(80,60,40,0.3), transparent 40%);
  mix-blend-mode: overlay; pointer-events: none;
}
.fp-after .shine {
  position:absolute; top: 0; left: -50%; width: 200%; height: 100%;
  background: linear-gradient(60deg, transparent 40%, rgba(255,255,255,0.5) 50%, transparent 60%);
  animation: shineMove 5s linear infinite;
  pointer-events: none;
}
@keyframes shineMove { from { transform: translateX(-30%);} to { transform: translateX(30%);} }

/* ---------- Booking ---------- */
.book-wrap {
  display: grid; grid-template-columns: 1.3fr 1fr; gap: 32px;
}
@media (max-width: 1000px){ .book-wrap { grid-template-columns: 1fr; } }

.book-card {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--radius-l);
  padding: 40px;
}
.book-steps { display:flex; gap: 8px; margin-bottom: 32px; }
.book-step {
  flex: 1; height: 4px; border-radius: 4px; background: var(--line);
  transition: background .3s;
}
.book-step.done, .book-step.active { background: var(--ice); }
.book-step-label { display:flex; justify-content: space-between; font-size: 11px; color: var(--fg-mute); letter-spacing: 0.16em; text-transform: uppercase; margin-bottom: 10px; }

.field { display:flex; flex-direction: column; gap: 8px; margin-bottom: 18px; }
.field label { font-size: 12px; color: var(--fg-dim); letter-spacing: 0.14em; text-transform: uppercase; font-weight: 600; }
.field input, .field textarea, .field select {
  background: var(--bg-2);
  border: 1px solid var(--line-strong);
  border-radius: 12px;
  padding: 14px 16px;
  color: var(--fg);
  font: inherit;
  outline: none;
  transition: border-color .2s, background .2s;
}
.field input:focus, .field textarea:focus, .field select:focus { border-color: var(--ice); }
.row-2 { display:grid; grid-template-columns: 1fr 1fr; gap: 14px; }
@media (max-width: 600px){ .row-2 { grid-template-columns: 1fr; } }

/* Photo drop zone */
.dropzone {
  border: 1.5px dashed var(--line-strong);
  border-radius: var(--radius-m);
  padding: 36px;
  text-align: center;

/* ========== Authentic Car Care — White Intro ========== */

function IntroAnimation({ onReveal, onComplete }) {
  const [phase, setPhase] = React.useState(0);
  const doneRef = React.useRef(false);

  const skip = () => {
    if (doneRef.current) return;
    doneRef.current = true;
    setPhase(4);
    document.body.style.overflow = '';
    onReveal();
    setTimeout(onComplete, 60);
  };

  React.useEffect(() => {
    document.body.style.overflow = 'hidden';

    const t = [
      setTimeout(() => setPhase(1), 400),
      setTimeout(() => setPhase(2), 1800),
      setTimeout(() => setPhase(3), 4500),
      setTimeout(() => onReveal(), 4800),
      setTimeout(() => {
        if (!doneRef.current) {
          doneRef.current = true;
          setPhase(4);
          document.body.style.overflow = '';
          onComplete();
        }
      }, 6800),
    ];

    return () => { t.forEach(clearTimeout); document.body.style.overflow = ''; };
  }, []);

  if (phase >= 4) return null;

  return (
    <div className={`intro intro-p${phase}`} onClick={skip}>
      <div className="intro-car">
        <img src="project/assets/hero-car-clean.png" alt="" />
      </div>

      <div className="intro-logo">
        <img src="project/assets/logo-glyph.png" alt="" />

            <span>Authentic</span>{' '}<em>Car Care</em>
          </h1>
          <p className="intro-sub">Mobile detailing across Prince Edward Island</p>
        </div>
      </div>

      <div className="intro-skip">Click anywhere to skip</div>
    </div>
  );
}

function BeforeAfter({ item }) {
  const stageRef = useR(null);
  const clipRef = useR(null);
  const handleRef = useR(null);
  const knobRef = useR(null);
  const dragging = useR(false);

  // Write the position straight to the DOM — no React re-render per move.
  const setFromClient = (clientX) => {
    const el = stageRef.current;
    if (!el) return;
    const r = el.getBoundingClientRect();
    const p = Math.max(0, Math.min(100, (clientX - r.left) / r.width * 100));
    if (clipRef.current) clipRef.current.style.clipPath = `inset(0 ${100 - p}% 0 0)`;
    if (handleRef.current) handleRef.current.style.left = `${p}%`;
    if (knobRef.current) knobRef.current.style.left = `${p}%`;
  };

  // While dragging, suppress the smooth transition so it tracks the finger 1:1.
  const setDragVisual = (on) => {
    const t = on ? 'none' : '';
    if (clipRef.current) clipRef.current.style.transition = t;
    if (handleRef.current) handleRef.current.style.transition = t;
    if (knobRef.current) knobRef.current.style.transition = t;
  };

  useE(() => {
    const onMove = (e) => { if (dragging.current) setFromClient(e.touches ? e.touches[0].clientX : e.clientX); };
    const onUp = () => { if (dragging.current) { dragging.current = false; setDragVisual(false); } };
    window.addEventListener('mousemove', onMove, { passive: true });
    window.addEventListener('touchmove', onMove, { passive: true });
    window.addEventListener('mouseup', onUp);
    window.addEventListener('touchend', onUp);
    return () => {
      window.removeEventListener('mousemove', onMove);
      window.removeEventListener('touchmove', onMove);
      window.removeEventListener('mouseup', onUp);
      window.removeEventListener('touchend', onUp);
    };
  }, []);

  const start = (clientX) => { dragging.current = true; setDragVisual(true); setFromClient(clientX); };
  const hasPhotos = item.before && item.after;

  return (
    <div
      className={`ba-stage ${hasPhotos ? 'ba-stage-photo' : ''} ${item.fill ? 'ba-stage-fill' : ''}`}
      ref={stageRef}
      onMouseDown={(e) => start(e.clientX)}
      onTouchStart={(e) => start(e.touches[0].clientX)}
    >
      {hasPhotos ? (
        <>
          <div className="ba-img ba-img-before">
            <img className="ba-photo" src={item.before} alt="Before" draggable="false" />
          </div>
          <div className="ba-img ba-img-after">
            <div className="ba-clip" ref={clipRef} style={{ clipPath: 'inset(0 50% 0 0)' }}>
              <img className="ba-photo" src={item.after} alt="After" draggable="false" />
            </div>
          </div>
        </>
      ) : (
        <>
          <div className="ba-img ba-img-before">
            <div className="fake-photo fp-before">
              <div className="grain" />
              <div className="fake-car"><FakeCar tone={item.id} dirty /></div>
            </div>
          </div>
          <div className="ba-img ba-img-after">
            <div className="ba-clip" ref={clipRef} style={{ clipPath: 'inset(0 50% 0 0)' }}>
              <div className="fake-photo fp-after">
                <div className="shine" />
                <div className="grain" />
                <div className="fake-car"><FakeCar tone={item.id} /></div>
              </div>
            </div>
          </div>
        </>
      )}
      <div className="ba-label before">Before</div>
      <div className="ba-label after">After</div>
      <div className="ba-handle" ref={handleRef} style={{ left: '50%' }} />
      <div className="ba-knob" ref={knobRef} style={{ left: '50%' }}>
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round">
          <path d="M8 6l-4 6 4 6M16 6l4 6-4 6" />
        </svg>
      </div>
    </div>
  );
}

/* ---------- Booking ---------- */
function Booking({ service, addons, total, onChangeService, onToggleAddon, waxAllowed }) {
  const [step, setStep] = useS(1);
  const [form, setForm] = useS({ name: '', email: '', phone: '', address: '', vehicle: '', date: '', time: '', notes: '' });
  const [photos, setPhotos] = useS([]);
  const [dragging, setDragging] = useS(false);
  const [submitted, setSubmitted] = useS(false);
  const inputRef = useR(null);

  const update = (k, v) => setForm((f) => ({ ...f, [k]: v }));

  const onFiles = (files) => {
    const arr = Array.from(files).slice(0, 6);
    const next = arr.map((f) => ({ id: Math.random().toString(36).slice(2, 9), url: URL.createObjectURL(f) }));
    setPhotos((p) => [...p, ...next].slice(0, 6));
  };

  const removePhoto = (id) => setPhotos((p) => p.filter((x) => x.id !== id));

  const submit = () => {
    setSubmitted(true);
    setTimeout(() => setSubmitted(false), 3500);
    setStep(1);
    setForm({ name: '', email: '', phone: '', address: '', vehicle: '', date: '', time: '', notes: '' });
    setPhotos([]);
  };

  const canAdvance =
    step === 1 ||
    (step === 2 && form.vehicle.trim().length > 1) ||
    (step === 3 && form.name && form.email && form.phone && form.address);

  return (
    <section id="book">
      <div className="wrap">
        <div className="section-title">
          <div>
            <div className="section-kicker">/ 03 — Book</div>
            <h2 className="display">Three steps. <em>Real quote.</em><br />Then we show up.</h2>
          </div>
          <div className="sub">Upload a couple of phone photos of your vehicle so we can confirm pricing before we arrive. No deposit required.</div>
        </div>

        <div className="book-wrap">
          <div className="book-card">
            <div className="book-step-label">
              <span>Step {step} of 3</span>
              <span>{step === 1 ? 'Service & add-ons' : step === 2 ? 'Vehicle photos' : 'When & where'}</span>
            </div>
            <div className="book-steps">
              {[1, 2, 3].map((n) => (
                <div key={n} className={`book-step ${n < step ? 'done' : n === step ? 'active' : ''}`} />
              ))}
            </div>

            {step === 1 && (
              <Step1 service={service} addons={addons} onChangeService={onChangeService} onToggleAddon={onToggleAddon} waxAllowed={waxAllowed} />
            )}
            {step === 2 && (
              <Step2
                inputRef={inputRef}
                photos={photos}
                onFiles={onFiles}
                removePhoto={removePhoto}
                dragging={dragging}
                setDragging={setDragging}
                form={form}
                update={update}
              />
            )}
            {step === 3 && (
              <Step3 form={form} update={update} service={service} />
            )}

            <div className="book-actions">
              <button
                className="btn"
                onClick={() => setStep((s) => Math.max(1, s - 1))}
                disabled={step === 1}
                style={{ opacity: step === 1 ? 0.4 : 1 }}
              >
                ← Back
              </button>
              {step < 3 ? (
                <button
                  className="btn btn-ice"
                  disabled={!canAdvance}
                  onClick={() => setStep((s) => s + 1)}
                  style={{ opacity: canAdvance ? 1 : 0.4 }}
                >
                  Next step <Arrow />
                </button>
              ) : (
                <button
                  className="btn btn-ice"
                  disabled={!canAdvance}
                  onClick={submit}
                  style={{ opacity: canAdvance ? 1 : 0.4 }}
                >
                  Send booking request <Arrow />
                </button>
              )}
            </div>
          </div>

          <BookSummary service={service} addons={addons} total={total} form={form} photos={photos} />
        </div>
      </div>
      {submitted && <div className="toast">✓ Booking sent — we'll text you within an hour.</div>}
    </section>
  );
}

function Step3({ form, update, service }) {
  const days = useM(() => {
    const out = [];
    const now = new Date();
    let i = 1;
    while (out.length < 8) {
      const d = new Date(now);
      d.setDate(now.getDate() + i);
      const dow = d.getDay();
      if (dow === 0 || dow === 6) out.push(d.toISOString().slice(0, 10));
      i++;
    }
    return out;
  }, []);

  const mode = service?.slotMode || 'window';
  const timeOptions = useM(() => {
    if (mode === 'window') {
      return [
        '8:00 — 10:00 am',
        '10:00 am — 12:00 pm',
        '12:00 — 2:00 pm',
        '2:00 — 4:00 pm',
        '4:00 — 6:00 pm',
      ];
    }
    if (mode === 'arrival') {
      return [
        'Morning — we arrive 8:00 am',
        'Midday — we arrive 11:30 am',
        'Afternoon — we arrive 1:30 pm',
      ];
    }
    return [
      'Morning block — 8:00 am start',
      'Afternoon block — 12:30 pm start',
    ];
  }, [mode]);

  useE(() => {
    if (form.time && !timeOptions.includes(form.time)) update('time', '');
  }, [timeOptions]);

  const timeHint =
    mode === 'window' ? 'Express Wash is quick (~45 min) — pick any 2-hour window.' :
    mode === 'arrival' ? `${service?.name} takes ${service?.durationLabel} — choose when we arrive and we'll have your car for the afternoon.` :
    `${service?.name} is a half-day job (${service?.durationLabel}) — we take one booking per block.`;

  return (
    <div>
      <div className="row-2">
        <div className="field">
          <label>Full name</label>
          <input value={form.name} onChange={(e) => update('name', e.target.value)} placeholder="First & last" />
        </div>
        <div className="field">
          <label>Phone</label>
          <input value={form.phone} onChange={(e) => update('phone', e.target.value)} placeholder="(902) 555-0123" />
        </div>
      </div>
      <div className="field">
        <label>Email</label>
        <input value={form.email} onChange={(e) => update('email', e.target.value)} placeholder="you@example.com" />
      </div>
      <div className="field">
        <label>Service address (PEI)</label>
        <input value={form.address} onChange={(e) => update('address', e.target.value)} placeholder="123 Water St, Charlottetown" />
      </div>
      <div className="row-2">
        <div className="field">
          <label>
            Preferred date{' '}
            <span style={{ color: 'var(--fg-mute)', fontWeight: 400, textTransform: 'none', letterSpacing: 0 }}>· weekends only</span>
          </label>
          <select value={form.date} onChange={(e) => update('date', e.target.value)}>
            <option value="">Pick a weekend day</option>
            {days.map((d) => (
              <option key={d} value={d}>
                {new Date(d + 'T12:00').toLocaleDateString('en-CA', { weekday: 'short', month: 'short', day: 'numeric' })}
              </option>
            ))}
          </select>
        </div>
        <div className="field">
          <label>Preferred {mode === 'window' ? 'window' : 'arrival'}</label>
          <select value={form.time} onChange={(e) => update('time', e.target.value)}>
            <option value="">{mode === 'window' ? 'Pick a window' : 'Pick when we arrive'}</option>
            {timeOptions.map((t) => <option key={t}>{t}</option>)}
          </select>
        </div>
      </div>
      <p style={{ fontSize: 12, color: 'var(--fg-mute)', margin: '-4px 0 0', lineHeight: 1.5 }}>{timeHint}</p>
    </div>
  );
}

function BookSummary({ service, addons, total, form, photos }) {
  const activeAddons = ADDONS.filter((a) => addons[a.id]);
  return (
    <aside className="book-summary">
      <h3>Your booking</h3>
      <div className="sub">Quote locks in once we confirm photos.</div>
      <div className="sum-row"><span className="lbl">Service</span><span className="val">{service?.name || '—'}</span></div>
      <div className="sum-row"><span className="lbl">Base price</span><span className="val">{fmt(service?.price || 0)}</span></div>
      {activeAddons.length === 0 ? (
        <div className="sum-empty">No add-ons selected</div>
      ) : (
        activeAddons.map((a) => (
          <div className="sum-row" key={a.id}>
            <span className="lbl">+ {a.name}</span>
            <span className="val">{fmt(a.price)}</span>
          </div>
        ))
      )}
      {form.vehicle && (
        <div className="sum-row">
          <span className="lbl">Vehicle</span>
          <span className="val" style={{ maxWidth: 160, textAlign: 'right', fontSize: 13 }}>{form.vehicle}</span>
        </div>
      )}
      {photos.length > 0 && (
        <div className="sum-row">
          <span className="lbl">Photos</span>
          <span className="val">{photos.length} attached</span>
        </div>
      )}
      {form.date && (
        <div className="sum-row">
          <span className="lbl">When</span>
          <span className="val" style={{ fontSize: 13 }}>
            {new Date(form.date + 'T12:00').toLocaleDateString('en-CA', { weekday: 'short', month: 'short', day: 'numeric' })}
            {form.time && ` · ${form.time}`}
          </span>
        </div>
      )}
      <div className="sum-row total">
        <span className="lbl">Estimated total</span>
        <span className="val">{fmt(total)}</span>
      </div>
      <p style={{ fontSize: 12, color: 'var(--fg-mute)', marginTop: 18, lineHeight: 1.5 }}>
        Prices in CAD. Final quote may adjust based on vehicle condition.
      </p>
    </aside>
  );
}
